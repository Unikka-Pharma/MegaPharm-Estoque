services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: megapharm
      POSTGRES_PASSWORD: megapharm
      POSTGRES_DB: megapharm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megapharm"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: any

  app:
    image: ghcr.io/unikka-pharma/megapharm-estoque:latest   # <-- precisa ser uma imagem já publicada
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://megapharm:megapharm@db:5432/megapharm
      # demais variáveis (JWT_SECRET, WEBHOOK_SECRET, HUBSPOT_*, ADMIN_*) também aqui,
      # já que env_file costuma ser ignorado no modo Swarm
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: any

volumes:
  pgdata: