name: build-image

# Builda a imagem a cada push na main e publica no Docker Hub (docker.io).
# Usa os secrets DOCKER_USERNAME / DOCKER_PASSWORD ja configurados no repo
# (mesma conta unikkapharma dos demais servicos da infra).
# O Portainer entao so puxa a imagem publicada — nao precisa buildar nada.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadados/tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Namespace unikkapharma no Docker Hub (igual aos outros servicos).
          images: docker.io/unikkapharma/megapharm-estoque
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
